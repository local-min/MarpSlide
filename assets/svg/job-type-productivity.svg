<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1B4565">職種別タスク完了率の変化（pt）</text>

  <!-- Grid lines -->
  <line x1="120" y1="60" x2="120" y2="330" stroke="#94A3B8" stroke-width="0.5"/>
  <line x1="120" y1="330" x2="560" y2="330" stroke="#94A3B8" stroke-width="1"/>

  <!-- Y-axis labels and grid -->
  <text x="110" y="335" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#64748B">-5</text>
  <line x1="120" y1="330" x2="560" y2="330" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="4"/>

  <text x="110" y="285" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#64748B">0</text>
  <line x1="120" y1="280" x2="560" y2="280" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="4"/>

  <text x="110" y="235" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#64748B">+5</text>
  <line x1="120" y1="230" x2="560" y2="230" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="4"/>

  <text x="110" y="185" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#64748B">+10</text>
  <line x1="120" y1="180" x2="560" y2="180" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="4"/>

  <text x="110" y="135" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#64748B">+15</text>
  <line x1="120" y1="130" x2="560" y2="130" stroke="#94A3B8" stroke-width="0.5" stroke-dasharray="4"/>

  <!-- Zero line -->
  <line x1="120" y1="280" x2="560" y2="280" stroke="#334155" stroke-width="1"/>

  <!-- Bars -->
  <!-- Engineer: +12pt -->
  <rect x="160" y="160" width="80" height="120" rx="4" fill="#1B4565"/>
  <text x="200" y="152" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B4565">+12</text>
  <text x="200" y="360" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#334155">エンジニア</text>

  <!-- Planning/Marketing: +3pt -->
  <rect x="270" y="250" width="80" height="30" rx="4" fill="#3E9BA4"/>
  <text x="310" y="242" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3E9BA4">+3</text>
  <text x="310" y="360" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#334155">企画</text>

  <!-- Management: -2pt -->
  <rect x="380" y="280" width="80" height="20" rx="4" fill="#94A3B8"/>
  <text x="420" y="318" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#94A3B8">-2</text>
  <text x="420" y="360" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#334155">管理職</text>

  <!-- Sales: +5pt -->
  <rect x="490" y="230" width="80" height="50" rx="4" fill="#2A5F8F"/>
  <text x="530" y="222" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2A5F8F">+5</text>
  <text x="530" y="360" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#334155">営業</text>

  <!-- Y-axis unit -->
  <text x="60" y="200" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#64748B" transform="rotate(-90, 60, 200)">タスク完了率変化 (pt)</text>
</svg>